url: https://mjfrigaard.github.io/fmggp2/

template:
  bootstrap: 5
  light-switch: false
  bslib:
    bg: "#0D0221"
    fg: "#E0E0FF"
    primary: "#FF2A6D"
    secondary: "#05D9E8"
    success: "#39FF14"
    info: "#05D9E8"
    warning: "#FFE600"
    danger: "#FF2A6D"
    link-color: "#05D9E8"
    link-hover-color: "#39FF14"
    navbar-bg: "#1A0B3B"
    code-bg: "#1A0B3B"
    code-color: "#39FF14"
    pre-bg: "#130630"
    border-color: "#FF2A6D"
    base_font: {google: "Space Mono"}
    heading_font: {google: "VT323"}
    code_font: {google: "Space Mono"}
    font-size-base: "0.95rem"
    headings-color: "#FF2A6D"

navbar:
  structure:
    left: [intro, reference, articles]
    right: [search, github]

reference:
- title: 90s themes
  contents:
  - theme_gameboy
  - theme_win98
  - theme_napster
  - theme_blockbuster
  - theme_spice
  - theme_beanie
  - theme_n64
  - theme_jurassic
  - theme_happymeal
  - theme_friends
  - theme_freshprince
  - theme_pogs
  - theme_walkman
  - theme_encarta
  - theme_netscape
  - theme_titanic
  - theme_lisafrank
  - theme_toysrus
  - theme_tamagotchi
  - theme_supersoaker
  - theme_goosebumps
  - theme_tetris
  - theme_furby
  - theme_trl
  - theme_oregontrail
  - theme_aim
  - theme_magiceye
  - theme_batman
  - theme_snick
  - theme_boyband
  - theme_savedbythebell
  - theme_hypercolor
  - theme_fmggp2
- title: Book helpers
  contents:
  - co_box
  - status
  - "`%nin%`"
- title: Fonts
  contents:
  - load_fmggp2_fonts
  - import_fmggp2_fonts
  - add_fonts
  - check_fonts
  - check_assets
  - list_fonts
  - font_path

articles:
- title: Articles
  navbar: ~
  contents:
  - themes
  - book-helpers
